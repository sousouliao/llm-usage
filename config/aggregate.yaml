# 公共聚合配置：不含任何凭据，随仓库提交，CI 用它重新生成 stats.json 与 SVG。
# 本机专属的采集配置（采集起点、base_url、凭据环境变量名）在 sources.yaml 里，不提交。

# 所有日切与周次统一按这个时区计算。两台机器都用同一个值，否则同一次请求在两边会
# 归到不同天。
timezone: Asia/Shanghai

# DeepSeek 平台账单是人民币。采集时按这个汇率折成美元分写入 cost_cents，
# 好和 Cursor / Codex 的 $ 加在同一张卡片上。1 USD = 7.2 CNY。
# 改了这个值需要重采 DeepSeek，不能只靠 --skip-collect。
usd_cny: 7.2

# 订阅制 ADE：raw 里没有官方 cost_cents。fold 时按下面的 API 牌价补折算成本；
# 对不上牌价的模型，金额列仍显示 Subscription。
subscription_sources:
  - codex
  - antigravity

# 公开 API 牌价，美元 / 百万 token，短上下文。用来给没有官方 totalCents 的行
# 补 model cost。这是 API-equivalent，不是账单，也不是 ChatGPT credits。
# 来源：https://developers.openai.com/api/docs/pricing
#       https://ai.google.dev/gemini-api/docs/pricing（Gemini，Paid Tier 标准档）
# 长上下文（单次输入 >272K）的加价无法从日聚合恢复，所以不用。
list_prices:
  gemini-3.8-flash:
    # 促销价，官方写到 2026-12-31，2027-01-01 起四项都翻倍。
    # Gemini 隐式缓存没有写入加价，cache_write 按输入价填；Antigravity 也不报缓存写。
    input: 0.75
    cache_read: 0.075
    cache_write: 0.75
    output: 3.75
  gpt-6-astra:
    input: 10.00
    cache_read: 1.00
    cache_write: 12.50
    output: 50.00
  gpt-5.6-sol:
    # 促销价，官方写至少到 2026-11-21。过期后核定价页。
    input: 4.00
    cache_read: 0.40
    cache_write: 5.00
    output: 20.00
  gpt-5.6-terra:
    input: 2.00
    cache_read: 0.20
    cache_write: 2.50
    output: 12.00
  gpt-5.6-luna:
    input: 0.20
    cache_read: 0.02
    cache_write: 0.25
    output: 1.20
  gpt-5.5:
    input: 5.00
    cache_read: 0.50
    cache_write: 6.25
    output: 30.00
  gpt-5.4:
    input: 2.50
    cache_read: 0.25
    cache_write: 3.125
    output: 15.00
  gpt-5.4-mini:
    input: 0.75
    cache_read: 0.075
    cache_write: 0.9375
    output: 4.50
  gpt-5.3-codex:
    input: 1.75
    cache_read: 0.175
    cache_write: 2.1875
    output: 14.00

# 只影响计价，不改展示用的模型名。-high / -medium 是推理档，token 量已经反映
# 多出来的输出；codex-auto-review 没有公开 SKU，按当前旗舰 Sol 计价。
price_aliases:
  gpt-5.6: gpt-5.6-sol
  gpt-5.6-sol-high: gpt-5.6-sol
  gpt-5.6-terra-high: gpt-5.6-terra
  gpt-5.6-luna-high: gpt-5.6-luna
  gpt-5.5-high: gpt-5.5
  gpt-5.5-medium: gpt-5.5
  gpt-5.4-high: gpt-5.4
  gpt-5.4-medium: gpt-5.4
  gpt-5.2-codex: gpt-5.3-codex
  codex-auto-review: gpt-5.6-sol

# 模型名归一表：同一模型在不同工具下的标签可能不同，
# 不归一的话模型排行会把同一个模型拆成多行。
#
# 原始事件里保留原名，归一只在聚合阶段做，将来发现映射错了可以重跑修正。
# 路由别名（Cursor 的 auto-smart）不进此表——它不是模型，等能解出背后的真实模型时
# 应该换成真名，而不是映射到另一个假名。
model_aliases: {}
