# 本机采集配置。复制为仓库根的 sources.yaml 后使用，该文件已被 gitignore。
#
# 这里只放采集阶段需要的东西。时区与模型别名表在 config/aggregate.yaml 里（随仓库
# 提交），因为聚合跑在 CI 上，而本文件不应该被提交。

# 本机标识。Cursor 是账号级接口，忽略此项。Codex 与 Antigravity 的会话只存在于产生
# 它的那台机器，两台机器必须用不同的名字（例如 work-mac / home-win），否则会互相覆盖。
machine: work-mac

# 采集起点。接口型源每次重采 [since, 今天] 全量并覆盖写回，所以这个值往前调不会
# 产生重复数据，只会多拉一些。留足够早即可，账号开通之前的日子不会生成空文件。
since: 2026-01-01

sources:
  # Cursor：走官方 dashboard 用量接口，拿逐次请求的 token 明细与折算成本。
  #
  # 认证默认从本机 Cursor 的登录态里读（state.vscdb 中的 cursorAuth/accessToken），
  # 所以本机登录着 Cursor 就不用配任何东西。换机或想显式指定时，设置环境变量
  # CURSOR_SESSION_TOKEN=<sub>::<jwt>，值可从 dashboard 请求的
  # WorkosCursorSessionToken cookie 里复制。
  - name: cursor
    type: cursor
    # token_env: CURSOR_SESSION_TOKEN

  # Codex：读本机 ~/.codex 会话日志里的逐次 token。
  # 只采 ChatGPT 订阅（model_provider=openai），中转站的调用直接丢弃（ADR 0003）。
  # 默认跨平台读取当前用户的 ~/.codex；通常无需配置。
  # Windows 也支持环境变量写法：%USERPROFILE%/.codex
  - name: chatgpt
    type: chatgpt
    # codex_home: ~/.codex

  # Antigravity：读本机会话库（每个会话一个 SQLite）里逐次模型调用的 token。
  # 默认读 ~/.gemini/antigravity/conversations 与 ~/.gemini/antigravity-cli/conversations；
  # Windows 上即 %USERPROFILE%/.gemini/antigravity/conversations，通常无需配置。
  # 存储格式自检不通过时整源跳过、不写 raw。
  - name: antigravity
    type: antigravity
    # antigravity_dirs:
    #   - ~/.gemini/antigravity/conversations

  # DeepSeek：走控制台月度导出，拿日 × 模型的 token 与人民币账单。
  # 认证是 platform.deepseek.com 的 userToken，不是 sk- API Key。
  # 登录用量页后，在 Console 执行 JSON.parse(localStorage.getItem('userToken')).value，
  # 设为环境变量 DEEPSEEK_PLATFORM_TOKEN。
  - name: deepseek
    type: deepseek
    # token_env: DEEPSEEK_PLATFORM_TOKEN
