# 原始数据一变就重新生成产物（data/stats.json 与 assets/*.svg）。
#
# 为什么放在 CI 而不是本机：产物由原始数据完全决定，放在这里单点串行生成，两台机器
# 就都不必碰产物文件，也不会在上面互相冲突。
#
# 聚合与渲染只读仓库内的文件——不访问网络、不需要 Cursor 登录态、不需要任何 secret。
# 采集是唯一需要凭据的环节，它只在本机跑（见 update-local.sh）。
#
# 产物不读运行时钟，所以重建幂等：同一份 raw 跑多少次都是同一批字节，这里也就只在
# 真有 diff 时才会落一个产物提交。
name: build artifacts

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "config/aggregate.yaml"
      - "stats.schema.json"
      - "llm_usage/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 两台机器接连推送时串行执行，避免并发提交产物。不取消进行中的那次：它已经
  # 在推产物了，中途掐掉会留下没有对应产物的原始数据。
  group: build-artifacts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑单测
        run: python tests/test_core.py

      - name: 生成并提交产物
        # 产物是 raw 的纯函数（不读时钟），所以「重新生成后有没有 diff」就是
        # 「要不要提交」的全部判据：没变就什么都不做，变了才落一个提交。
        #
        # 同一个 sha 可能派生出两次运行（两台机器几乎同时推送，或 CI 回写产物
        # 又触发一次）。并发组只保证两次运行不同时推，不保证本运行开始后远端没
        # 有前进，所以后一个运行仍可能被非快进拒绝。产物可无条件重建，被拒时
        # 就丢弃自己这份、在最新远端上重跑一次，不会留任何冲突文件。
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "==> 推送被拒，基于最新远端重新生成产物（第 $attempt 次尝试）"
              git fetch --depth=1 origin main
              git reset -q --hard FETCH_HEAD
            fi

            python -m llm_usage --skip-collect

            # 产物与已提交的一致：raw 没带来任何影响展示的变化，没有东西要推。
            if git diff --quiet -- data/stats.json assets; then
              echo "产物无变化，跳过提交。"
              exit 0
            fi

            git add data/stats.json assets
            git commit -q -m "chore(ci): rebuild usage artifacts"
            if git push -q; then
              echo "产物已推送。"
              exit 0
            fi
          done
          echo "错误：连续重试仍无法推送产物。" >&2
          exit 1
